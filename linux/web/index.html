<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌面小猫</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: transparent; overflow: hidden;
    user-select: none; -webkit-user-drag: none;
  }
  #stage { position: relative; width: 100%; height: 100%; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  /* cat.js 依赖这两个类名 */
  .chip {
    position: absolute; transform: translate(-50%, -100%);
    padding: 0 6px; border-radius: 6px;
    background: #fffdf4; border: 1.5px solid #17171b; color: #17171b;
    font: 700 13px "Noto Sans CJK SC", "Source Han Sans SC", "WenQuanYi Micro Hei", sans-serif;
    pointer-events: none; transition: opacity .2s; z-index: 3;
  }
  .zzz {
    position: absolute; pointer-events: none; display: none;
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "WenQuanYi Micro Hei", sans-serif;
    font-weight: 700; color: #17171b; z-index: 3;
  }
  .zzz span {
    position: absolute; left: 0; top: 0; opacity: 0; font-size: 1em; line-height: 1;
    transform-origin: 0 100%; animation: zfloat 3.3s linear infinite;
  }
  .zzz span:nth-child(2) { animation-delay: 1.1s; }
  .zzz span:nth-child(3) { animation-delay: 2.2s; }
  @keyframes zfloat {
    0%   { opacity: 0; transform: translate(0, 0) scale(.28); }
    12%  { opacity: 1; }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translate(1.4em, -2.6em) scale(1); }
  }
  .heart span { color: #e4556a; }
  .ire svg, .heart span svg { width: 1em; height: 1em; display: block; }
  /* 发火：身后的红色光晕 + 头顶三团火气 + 耳朵冒热汽 */
  .aura {
    position: absolute; left: 50%; top: 50%; width: 86%; height: 70%;
    transform: translate(-50%, -50%); pointer-events: none; display: none;
    border-radius: 50%; z-index: 0;
    background: radial-gradient(closest-side,
      rgba(255,92,58,.62), rgba(255,92,58,.30) 52%, rgba(255,92,58,0) 80%);
  }
  #stage canvas { position: relative; z-index: 1; }
  .steam {
    position: absolute; pointer-events: none; display: none;
    width: 1em; height: 1em; z-index: 2;
  }
  .steam span {
    position: absolute; left: 50%; bottom: 0; width: .55em; height: .55em; border-radius: 50%;
    background: radial-gradient(circle at 42% 42%, rgba(255,246,240,.95), rgba(255,246,240,0) 70%);
    opacity: 0; animation: steamUp 1.05s linear infinite;
  }
  .steam span:nth-child(2) { animation-delay: .35s; }
  .steam span:nth-child(3) { animation-delay: .7s; }
  @keyframes steamUp {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(.35); }
    22%  { opacity: .95; }
    100% { opacity: 0; transform: translate(-50%, -2.3em) scale(1.7); }
  }
  /* 急眼：连续打字太久，头顶冒出来的那一团火气 */
  .ire {
    position: absolute; pointer-events: none; display: none; z-index: 2;
    line-height: 1; font-size: 1em;
    transform: translate(-50%, -50%); transform-origin: 50% 50%;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.28));
    will-change: transform, opacity;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <script src="qt-bridge.js"></script>
  <script src="src/three.min.js"></script>
  <script src="src/cat.js"></script>
  <script src="glue.js"></script>
</body>
</html>
